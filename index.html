<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpeedProspect" />
    <title>SpeedProspect</title>
    <script>
      // Aplica o tema salvo antes da renderização para evitar flash
      try {
        var t = localStorage.getItem('sp-tema');
        if (t === 'dark' || t === 'night') document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
